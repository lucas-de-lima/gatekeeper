name: CI

on:
  pull_request:
    branches: [ "main", "develop" ]
  push:
    branches: [ "develop" ]

jobs:
  build:
    name: Build & Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gatekeeper
          POSTGRES_PASSWORD: gatekeeper
          POSTGRES_DB: gatekeeper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U gatekeeper"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://gatekeeper:gatekeeper@localhost:5432/gatekeeper_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod tidy

      - name: Install and Run Linter (Natively)
        run: |
          echo "Compilando golangci-lint com Go 1.26..."
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          echo "Executando o linter..."
          $(go env GOPATH)/bin/golangci-lint run ./...

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test ./... -v

      - name: Test coverage
        run: |
          go test ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out
